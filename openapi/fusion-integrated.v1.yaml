openapi: 3.0.3
info:
  title: Fusion-Integrated API
  version: 1.0.0
  description: Non-academic platform. Independent modules, one login.
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: Sets the httpOnly session cookie. The token itself is never returned
        in the body.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/directory/users:
    get:
      operationId: v1_directory_users_retrieve
      description: |-
        Type-ahead over the local projection. Read-only by construction —
        directory data is owned by IAM and edited there.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResult'
          description: ''
  /api/v1/leave/accounts/{user_id}:
    get:
      operationId: v1_leave_accounts_list
      description: An employee's leave account, as the office sees it.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveBalance'
          description: ''
  /api/v1/leave/accounts/{user_id}/ledger:
    get:
      operationId: v1_leave_accounts_ledger_list
      description: 'Account transactions: why a balance is what it is.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
          description: ''
  /api/v1/leave/accounts/adjust:
    post:
      operationId: v1_leave_accounts_adjust_create
      description: EL-UC-017 — an authorised balance correction.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceAdjustment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BalanceAdjustment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BalanceAdjustment'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveBalance'
          description: ''
  /api/v1/leave/balances:
    get:
      operationId: v1_leave_balances_list
      description: EL-UC-012 — current balances for the caller's own account.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveBalance'
          description: ''
  /api/v1/leave/config/calendar:
    get:
      operationId: v1_leave_config_calendar_list
      description: EL-UC-015 — create or revise the holiday/RH calendar.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayCalendar'
          description: ''
    post:
      operationId: v1_leave_config_calendar_create
      description: EL-UC-015 — create or revise the holiday/RH calendar.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalendarWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalendarWrite'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayCalendar'
          description: ''
  /api/v1/leave/config/calendar/{id}/publish:
    post:
      operationId: v1_leave_config_calendar_publish_create
      description: EL-UC-015 M3/M4 — publishing makes this the governing calendar.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayCalendar'
          description: ''
  /api/v1/leave/config/hierarchy:
    get:
      operationId: v1_leave_config_hierarchy_retrieve
      description: EL-UC-014 — the hierarchy the routing is resolved from (BR-EL-019).
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: v1_leave_config_hierarchy_update
      description: EL-UC-014 — the hierarchy the routing is resolved from (BR-EL-019).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HierarchyReplace'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HierarchyReplace'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HierarchyReplace'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/leave/config/policy:
    get:
      operationId: v1_leave_config_policy_list
      description: EL-UC-014 — the current leave-policy parameters.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeavePolicy'
          description: ''
    put:
      operationId: v1_leave_config_policy_update
      description: EL-UC-014 — the current leave-policy parameters.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PolicyWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PolicyWrite'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeavePolicy'
          description: ''
  /api/v1/leave/config/sla:
    get:
      operationId: v1_leave_config_sla_list
      description: EL-UC-018 — reminder and escalation thresholds (BR-EL-038).
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlaThreshold'
          description: ''
    put:
      operationId: v1_leave_config_sla_update
      description: EL-UC-018 — reminder and escalation thresholds (BR-EL-038).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaThresholdWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SlaThresholdWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SlaThresholdWrite'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaThreshold'
          description: ''
  /api/v1/leave/ledger:
    get:
      operationId: v1_leave_ledger_list
      description: 'Why the balance is what it is: the account''s own transactions.'
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
          description: ''
  /api/v1/leave/records:
    get:
      operationId: v1_leave_records_list
      description: Every leave record, within the caller's visible scope (EL-UC-017).
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/records/{id}/adjustments:
    get:
      operationId: v1_leave_records_adjustments_list
      description: The maintenance history of one record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordAdjustment'
          description: ''
  /api/v1/leave/records/{id}/correct:
    post:
      operationId: v1_leave_records_correct_create
      description: EL-UC-017 — correct a recorded value, keeping before and after.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCorrection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordCorrection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordCorrection'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/records/offline:
    post:
      operationId: v1_leave_records_offline_create
      description: |-
        EL-UC-016 — synchronise leave already sanctioned outside ELM.

        Record synchronisation, not a second approval: there is no approval
        workflow behind this endpoint (BR-EL-029).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfflineRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfflineRecord'
        required: true
      security:
      - iamSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests:
    post:
      operationId: v1_leave_requests_create
      description: EL-UC-001 — create and submit one leave application.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyLeave'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplyLeave'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyLeave'
        required: true
      security:
      - iamSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests/{id}:
    get:
      operationId: v1_leave_requests_retrieve
      description: One request with its history, if the caller may see it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests/{id}/cancellation:
    post:
      operationId: v1_leave_requests_cancellation_create
      description: EL-UC-008 — request pre-start cancellation of an approved leave.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancellation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cancellation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cancellation'
      security:
      - iamSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests/{id}/extension:
    post:
      operationId: v1_leave_requests_extension_create
      description: EL-UC-009 — ask for additional time on ongoing EL/COL/VL.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Extension'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Extension'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Extension'
        required: true
      security:
      - iamSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests/{id}/print:
    get:
      operationId: v1_leave_requests_print_retrieve
      description: CSV representation of one leave application.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/v1/leave/requests/{id}/resumption:
    post:
      operationId: v1_leave_requests_resumption_create
      description: EL-UC-010 — declare the actual return to duty for review.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumptionSubmit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumptionSubmit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumptionSubmit'
        required: true
      security:
      - iamSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveResumption'
          description: ''
  /api/v1/leave/requests/{id}/substitute:
    post:
      operationId: v1_leave_requests_substitute_create
      description: EL-UC-019 — recover from a decline with one replacement nominee.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominateReplacement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NominateReplacement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NominateReplacement'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstituteAssignment'
          description: ''
  /api/v1/leave/requests/{id}/withdraw:
    post:
      operationId: v1_leave_requests_withdraw_create
      description: EL-UC-007 — withdraw a pending request, effective immediately.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveWithdraw'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeaveWithdraw'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeaveWithdraw'
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests/mine:
    get:
      operationId: v1_leave_requests_mine_list
      description: EL-UC-012 — the caller's own requests, newest first.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/leave/requests/validate:
    post:
      operationId: v1_leave_requests_validate_create
      description: EL-UC-001 M4 — validate a would-be application before submitting
        it.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateLeave'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidateLeave'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidateLeave'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/leave/resumptions:
    get:
      operationId: v1_leave_resumptions_list
      description: EL-UC-011 — resumption submissions awaiting review.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveResumption'
          description: ''
  /api/v1/leave/resumptions/{id}:
    get:
      operationId: v1_leave_resumptions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveResumption'
          description: ''
  /api/v1/leave/resumptions/{id}/review:
    post:
      operationId: v1_leave_resumptions_review_create
      description: EL-UC-011 — review the actual return and synchronise what it requires.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumptionReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumptionReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumptionReview'
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveResumption'
          description: ''
  /api/v1/leave/substitutions:
    get:
      operationId: v1_leave_substitutions_list
      description: |-
        EL-UC-002 — responsibility requests nominated to the caller.

        No permission beyond module access: the nomination is the authority, and a
        substitute is any employee (BR-EL-014).
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubstituteAssignment'
          description: ''
  /api/v1/leave/substitutions/{id}/respond:
    post:
      operationId: v1_leave_substitutions_respond_create
      description: EL-UC-002 M3 — accept or decline; a decline closes the consent
        gate.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstituteRespond'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubstituteRespond'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubstituteRespond'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstituteAssignment'
          description: ''
  /api/v1/leave/summary:
    get:
      operationId: v1_leave_summary_retrieve
      description: What the employee's own landing screen needs, in one call.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/leave/tasks:
    get:
      operationId: v1_leave_tasks_list
      description: EL-UC-003/004/005 — what is waiting on the caller's office.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowTask'
          description: ''
  /api/v1/leave/tasks/{id}/decision:
    post:
      operationId: v1_leave_tasks_decision_create
      description: 'One routed step: recommend, verify, approve or reject.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Decision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Decision'
        required: true
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/me:
    get:
      operationId: v1_me_retrieve
      description: |-
        The session payload the shell renders its sidebar from. `navigation`
        arrives already filtered, so the client cannot draw an ungranted module.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/placement/announcements:
    get:
      operationId: v1_placement_announcements_list
      description: |-
        Recruiters authenticate on a separate scheme; both pools land on
        `request.principal`.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
